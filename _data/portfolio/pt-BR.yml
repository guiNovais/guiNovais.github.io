experience:
  - company: Inter
    role: Software Developer Analyst III
    period: Agosto de 2025 – Presente
    highlights: |-
      Tive a oportunidade de ingressar no Inter como desenvolvedor sênior, sendo esta
      a primeira vez atuando como colaborador efetivo em uma instituição financeira,
      promovendo soluções voltadas diretamente ao negócio.

      Logo no início, passei a atuar com Server-Driven UI (SDUI), conceito que traz
      grande flexibilidade à evolução de interfaces e viabiliza entregas com menor
      acoplamento a releases de frontend. Também foi nesse momento que tive meu
      primeiro contato estruturado com ferramentas de IA generativa, as quais fomos
      incentivados a explorar desde o início.

      Atuei na reestruturação do serviço de definição de meios de pagamento da empresa.
      A proposta era migrar de um fluxo síncrono tradicional para um modelo assíncrono
      orientado à experiência do usuário: os diferentes meios de pagamento eram
      apresentados à medida que sua elegibilidade era avaliada em paralelo. Para isso,
      adotamos uma abordagem baseada no padrão SAGA.

      Utilizamos o Axon Framework como base e exploramos conceitos como
      Command Query Responsibility Segregation (CQRS), Event Sourcing e Domain-Driven
      Design (DDD). Como infraestrutura assíncrona, trabalhamos com Apache Kafka e
      AWS SQS. Para entregar o progresso e o resultado dessas operações em tempo real
      ao usuário, implementamos endpoints com Server-Sent Events (SSE).

      Com a consolidação do uso de IA generativa no dia a dia, buscamos formas mais
      eficazes de aplicá-la ao desenvolvimento. Adotamos uma arquitetura própria
      inspirada em Spec-Driven Development (SDD), com etapas bem definidas de
      exploração, especificação, implementação e revisão, obtendo resultados bastante
      satisfatórios com essa abordagem.

      > ## Principais técnicas e ferramentas
      - Java 21 e 25
      - SDUI (Server-Driven UI)
      - Arquitetura SAGA
      - Axon Framework
      - CQRS
      - Event Sourcing
      - DDD (Domain-Driven Design)
      - Idempotência
      - IaC (Infrastructure as Code)
      - HTTP SSE (Server-Sent Events)
      - Apache Kafka
      - AWS SQS
      - Arquitetura de microsserviços
      - Micronaut
      - Spec-Driven Development (SDD)
      - OpenSpec
      - MCP (Model Context Protocol)
      - SonarQube
      - JaCoCo
      - Grafana

  - company: Framework Digital
    role: Analista de Desenvolvimento de Sistemas
    period: Maio de 2022 – Agosto de 2025
    highlights: |-
      Na Framework Digital, retomei o trabalho com chatbots para a Localiza, utilizando
      a plataforma Blip (da Take). Diferente de abordagens puramente em árvore, o Blip
      permitia a construção de fluxos conversacionais em formato de grafo, com integrações
      via WhatsApp.

      Em seguida, atuei na F1rst, braço tecnológico do Banco Santander, em um dos maiores
      desafios da época: a incorporação das carteiras de crédito consignado da Olé Consignado,
      adquirida pelo Santander. Foi necessário migrar clientes e dados entre ecossistemas
      distintos, atuando em paralelo nos sistemas legados em .NET Framework da Olé Consignado
      e nas aplicações do Santander, baseadas em seus frameworks próprios construídos sobre
      Spring Boot.

      Por fim, integrei um projeto de Supply Chain para a VLI, empresa de logística do grupo
      Vale, com foco na automação e no controle dos silos do terminal portuário TIPLAM.
      Nesse projeto, tive a oportunidade de aprofundar meus conhecimentos em Arquitetura
      Hexagonal (Ports & Adapters), seguindo fielmente o padrão já adotado pela solução.

      > ## Principais técnicas e ferramentas
      - C#
      - .NET Framework
      - Java 11 / 17
      - Spring Boot
      - JPA / Hibernate
      - SQL Server
      - Web Services
      - APIs RESTful
      - SOAP / WSDL
      - BMC Control-M
      - ServiceNow
      - Jira
      - OpenText ALM Octane
      - Grafana
      - Arquitetura Hexagonal (Ports & Adapters)
      - SonarQube
      - JaCoCo

  - company: Montreal M.I
    role: Analista de Sistemas
    period: Janeiro de 2021 – Maio de 2022
    highlights: |-
      Durante a pandemia de COVID-19, tive a oportunidade de atuar no meu primeiro projeto
      direto para uma instituição financeira: o Banco de Desenvolvimento de Minas Gerais
      (BDMG), por meio da Montreal M.I.

      Nesse projeto, participei de ponta a ponta da evolução dos sistemas do banco,
      implementando novas funcionalidades que abrangiam desde a modelagem de dados até
      o backend e as interfaces com Angular e React Native.

      > ## Principais técnicas e ferramentas
      - Java 8
      - Java EE (JEE)
      - JPA / Hibernate
      - JUnit
      - APIs REST
      - SQL Server
      - Angular
      - SonarQube
      - JaCoCo
      - Web Services

  - company: Hop AI
    role: Desenvolvedor de Software
    periods:
      - Setembro de 2019 – Dezembro de 2020
    highlights: |-
      Ao final de 2019, retornei à Hop AI, empresa especializada em soluções com Inteligência
      Artificial e parceira da IBM. Fui alocado no projeto da Anglo American, com maior
      complexidade em relação aos anteriores: um chatbot com capacidade de interação por voz,
      voltado a operar em ambientes com alto nível de ruído, típicos de uma mina a céu aberto.

      Para garantir a correta compreensão da fala dos operadores, trabalhei fortemente com
      os serviços IBM Watson Speech to Text e IBM Watson Text to Speech, além de adaptar o
      Watson Assistant ao vocabulário técnico da área, que incluía unidades de medida
      específicas do processo de mineração.

      > ## Principais técnicas e ferramentas
      - IBM Cloud
      - IBM Watson Assistant
      - IBM Watson Speech to Text
      - IBM Watson Text to Speech
      - Java 8
      - Spring Boot
      - AngularJS
      - Web Services

  - company: dti digital
    role: Analista de Sistemas
    period: Fevereiro de 2019 – Setembro de 2019
    highlights: |-
      Na dti digital, atuei como desenvolvedor Pleno no projeto de chatbot da MRV Engenharia,
      com integração ao WhatsApp Business, ainda pouco explorado na época.

      Foi minha primeira experiência profissional com C# e .NET Core. Por já ter sólida
      bagagem com Java, a transição foi bastante natural. Também participei do projeto de
      transformação digital da plataforma de precificação de imóveis da MRV, que envolvia
      regras de negócio complexas. Para melhor organizar a lógica, utilizamos o padrão
      Mediator com a biblioteca MediatR, garantindo maior separação de responsabilidades.

      > ## Principais técnicas e ferramentas
      - C#
      - .NET Core
      - Web Services
      - IBM Watson Assistant
      - WhatsApp Business Platform
      - NUnit
      - MediatR
      - SonarQube
      - JaCoCo

  - company: Hop AI
    role: Desenvolvedor de Software
    periods:
      - Outubro de 2017 – Fevereiro de 2019
    highlights: |-
      Iniciei minha carreira na Hop AI como estagiário, sendo efetivado como desenvolvedor
      Júnior. Por ser parceira da IBM, a empresa tinha forte atuação com IBM Cloud e
      IBM Watson, principalmente com o Watson Conversation, precursor do Watson Assistant.

      Atuei no desenvolvimento e evolução de chatbots para grandes clientes, como Stihl,
      FCA e Tigre. No caso do Tigre, acompanhei o projeto do início ao fim: concepção,
      curadoria de intenções, evolução dos fluxos e mensuração de performance.

      Criei consultas personalizadas na plataforma para reconstruir os diálogos completos
      dos usuários, o que me permitia identificar com precisão se os ajustes deveriam ser
      feitos nos classificadores de intenção (intents) ou na estrutura do fluxo conversacional.
      Utilizando as métricas Precision, Recall e F1-Score, aliado ao volume de invocações
      por intent, elaborei relatórios que guiaram a evolução do bot.

      Durante essa jornada, também tive contato com AngularJS, Spring Boot, PostgreSQL,
      MongoDB, webhooks para integração com Facebook Messenger, CI/CD com IBM Continuous
      Delivery, Blue-Green Deployments, TDD, testes automatizados com Selenium e a
      certificação IBM Certified Application Developer – Watson V3.

      > ## Principais técnicas e ferramentas
      - IBM Cloud
      - IBM Watson Assistant
      - IBM Watson Discovery
      - Java 8
      - Spring Boot
      - JPA / Hibernate
      - JUnit
      - PostgreSQL
      - MongoDB
      - AngularJS
      - Selenium
      - Web Services
      - Webhooks
      - Facebook Messenger

education:
  - institution: Centro Universitário de Belo Horizonte | UniBH
    degree: Bacharelado em Ciência da Computação
    period: 2013 – 2017
    description: |-
      O curso do UniBH tem duração de quatro anos e oferece uma base teórica profunda
      em Programação de Computadores, Matemática e Lógica. Os conhecimentos básicos 
      discutidos no curso dão segurança aos alunos para que possam se estabelecer na área de TI 
      por tempo indeterminado. Estes fundamentos são conceitos que não se alteram tão rapidamente
      quanto as tecnologias da informática, que surgem e morrem anualmente. Após a consolidação
      das bases da Ciência da Computação, o aluno tem contato com as tecnologias de TI (banco de dados,
      redes de computadores, inteligência artificial, compiladores, engenharia de software etc.).
      Esta união entre ciência básica e tecnologia, aliada a uma elevada carga de trabalhos práticos 
      extraclasse, formam pessoas capazes de transformar o mercado de trabalho, por meio da 
      geração de novas tecnologias.

